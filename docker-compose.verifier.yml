services:
  openclaw-gateway:
    environment:
      OPENCLAW_VERIFIER_IMAGE_ID: ${OPENCLAW_VERIFIER_IMAGE_ID:?set OPENCLAW_VERIFIER_IMAGE_ID}
      OPENCLAW_VERIFIER_ARTIFACT_DIGEST: ${OPENCLAW_VERIFIER_ARTIFACT_DIGEST:?set OPENCLAW_VERIFIER_ARTIFACT_DIGEST}
      OPENCLAW_VERIFIER_DEPENDENCY_MANIFEST: ${OPENCLAW_VERIFIER_DEPENDENCY_MANIFEST:?set OPENCLAW_VERIFIER_DEPENDENCY_MANIFEST}
      OPENCLAW_VERIFIER_BROWSER_MANIFEST: ${OPENCLAW_VERIFIER_BROWSER_MANIFEST:?set OPENCLAW_VERIFIER_BROWSER_MANIFEST}
      OPENCLAW_VERIFIER_REPOSITORY_IDENTITY: ${OPENCLAW_VERIFIER_REPOSITORY_IDENTITY:?set OPENCLAW_VERIFIER_REPOSITORY_IDENTITY}
      OPENCLAW_VERIFIER_BROWSER_IDENTITY: ${OPENCLAW_VERIFIER_BROWSER_IDENTITY:?set OPENCLAW_VERIFIER_BROWSER_IDENTITY}
      OPENCLAW_VERIFIER_EFFECTIVE_YARN_VERSION: ${OPENCLAW_VERIFIER_EFFECTIVE_YARN_VERSION:?set OPENCLAW_VERIFIER_EFFECTIVE_YARN_VERSION}
    volumes:
      - type: bind
        source: ${OPENCLAW_VERIFIER_WORKSPACE_DIR:?set OPENCLAW_VERIFIER_WORKSPACE_DIR}
        target: ${OPENCLAW_VERIFIER_GATEWAY_WORKSPACE:?set OPENCLAW_VERIFIER_GATEWAY_WORKSPACE}
        read_only: true
